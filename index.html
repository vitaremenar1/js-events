<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Filmoteka</title>
    <link rel="stylesheet" href="dist/output.css">
    <script src="js/main.js" defer></script>
</head>

<body class="bg-slate-100 text-shadow-slate-800">

    <main class="mx-auto max-w-2xl space-y-6 p-4">

        <h1 class="text-3xl font-bold">Filmoteka</h1>

        <div id="hint" class="flex items-center gap-3 rounded bg-amber-100 p-3 text-sm">
            <p class="flex-1">Savjet: tipka Esc u polju za pretragu briše upisani pojam</p>
            <button id="hint-close" type="button" class="rounded px-2 py-1">Zatvori</button>
        </div>

        <form id="add-form" class="space-y-3 rounded bg-white p-4 shadow">
            <h2 class="text-xl font-semibold">Novi film</h2>

            <div>
                <label for="title" class="block text-sm font-medium">Naziv</label>
                <input id="title" name="title" type="text" 
                    class="w-full rounded border border-slate-300 px-1 py-1">
                <p id="title-error" class="text-sm text-red-600"></p>
            </div>

            <div class="flex gap-3">
                <div class="flex-1">
                    <label for="genre" class="block text-sm font-medium">Žanr</label>
                    <select id="genre" name="genre"
                    class="w-full rounded border border-slate-300 px-2 py-1">
                        <option value="">Odaberi žanr</option>
                        <option value="animirani">Animirani</option>
                        <option value="dokumentarni">Dokumentarni</option>
                        <option value="drama">Drama</option>
                        <option value="komedija">Komedija</option>
                    </select>
                    <p id="genre-error" class="text-sm text-red-600"></p>
                </div>

                <div class="flex-1">
                    <label for="minutes" class="block text-sm font-medium">Trajanje (min)</label>
                    <input id="minutes" name="minutes" type="number" class="w-full rounded border border-slate-300
                    px-2 py-1"></input>
                    <p id="minutes-error" class="text-sm text-red-600"></p>
                </div>

                <label class="flex items-center gap-2 text-sm">
                    <input name="watched" type="checkbox">Već pogledano
                </label>

                <button type="submit" class="rounded bg-indigo-700 px-4  py-2 font-medium text-white hover:bg-indigo-700"> Dodaj </button>
            </div>

        </form>

        <p id="counter" class="text-sm text-slate-600"></p>

        <ul id="list" class="space-y-2"></ul>

        <p id="empty" hidden class="text-slate-500">Nema filma koji odgovaraju odabiru.</p>

    </main>

    
</body>

</html>
